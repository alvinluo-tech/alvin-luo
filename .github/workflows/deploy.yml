# 部署到 GitHub Pages
# 两种模式（自动适配）：
#   A. 仓库名 = 你的自定义域名（如 alvin-luo.me）：
#      仓库根放一个 CNAME 文件（内容就是域名），basePath 自动留空，
#      站点落在 https://alvin-luo.me 根路径
#   B. 普通项目仓库名（如 personal-website）：
#      站点落在 https://<用户名>.github.io/<仓库名>/，basePath 自动取仓库名
# 前置：仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 默认就用线上 Worker；想换地址再在仓库变量里覆盖
      PHOTO_MANIFEST_URL: ${{ vars.PHOTO_MANIFEST_URL || 'https://upload.alvin-luo.me/manifest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # basePath 自动判断：用户主站仓库（*.github.io）或带 CNAME 的仓库 → 留空；
      # 其余项目仓库 → /仓库名
      - name: Compute basePath
        id: basepath
        run: |
          NAME="${{ github.event.repository.name }}"
          if [[ "$NAME" == *.github.io ]] || [ -f CNAME ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$NAME" >> "$GITHUB_OUTPUT"
          fi

      # 上一次成功构建的照片清单：Worker 短暂不可达时的兜底。
      # 仓库里提交的生成文件是空表，若不做这一步，失败兜底等于「全站照片静默消失」。
      - name: Restore last trip photos manifest
        if: env.PHOTO_MANIFEST_URL != ''
        uses: actions/cache/restore@v4
        with:
          path: data/trip-photos.generated.ts
          key: trip-photos-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trip-photos-manifest-

      # 同步 R2 照片清单：失败重试 3 次；仍失败则沿用上面恢复的历史清单继续构建。
      # 变量没配且生成文件不存在时，写空表兜底。
      - name: Sync trip photos
        run: |
          ok=""
          if [ -n "$PHOTO_MANIFEST_URL" ]; then
            for i in 1 2 3; do
              echo "attempt $i: $PHOTO_MANIFEST_URL"
              if node scripts/gen-trip-photos.mjs --remote "$PHOTO_MANIFEST_URL" --strict; then
                ok=1
                break
              fi
              sleep $((i * 5))
            done
          else
            # 没配清单地址：交给仓库里提交的生成文件，没有才写空表
            [ -f data/trip-photos.generated.ts ] || node scripts/gen-trip-photos.mjs --in /dev/null
            ok=1
          fi

          # 只有「配置了地址且重试全失败」才走降级分支
          if [ -n "$PHOTO_MANIFEST_URL" ] && [ -z "$ok" ]; then
            if grep -q 'url: "' data/trip-photos.generated.ts 2>/dev/null; then
              echo "::warning::照片清单拉取失败，已沿用上一次构建的 manifest（可能缺最新照片），构建继续。"
            else
              node scripts/gen-trip-photos.mjs --in /dev/null
              echo "::error::照片清单拉取失败且没有历史清单——本次部署将不含上传照片。Worker 恢复后重新发布即可。"
            fi
          fi

      # 是否真的有照片（生成的条目行是 url: "..."；类型定义 url: string 不算）
      - name: Check manifest validity
        if: always()
        id: manifest
        run: |
          if [ -f data/trip-photos.generated.ts ] && grep -q 'url: "' data/trip-photos.generated.ts; then
            echo "has_photos=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_photos=false" >> "$GITHUB_OUTPUT"
          fi

      # 只缓存带真实照片的清单：空表入缓存会污染之后所有兜底
      - name: Save trip photos manifest cache
        if: env.PHOTO_MANIFEST_URL != '' && steps.manifest.outputs.has_photos == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/trip-photos.generated.ts
          key: trip-photos-manifest-${{ github.run_id }}-${{ github.run_attempt }}

      # 注入 basePath + 静态导出开关（静态模式没有 /api 代理，NOW PLAYING 走降级）
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          BUILD_STATIC: "1"

      # 自定义域名：仓库根的 CNAME 文件原样带进产物
      - name: Copy CNAME
        if: hashFiles('CNAME') != ''
        run: cp CNAME out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
